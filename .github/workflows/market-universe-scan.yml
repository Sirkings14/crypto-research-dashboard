name: Public multi-market snapshot

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
  push:
    branches: [phase2-multi-market-data]
    paths:
      - "market_universe.py"
      - "market_universe_worker.py"
      - "market_analysis.py"
      - ".github/workflows/market-universe-scan.yml"

permissions:
  contents: read

concurrency:
  group: public-market-snapshot
  cancel-in-progress: false

jobs:
  collect-public-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Collect completed Spot and Futures candles and analyze
        run: python market_universe_worker.py
      - name: Preserve data and analysis as short-lived artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-market-research
          path: |
            data/market_universe_latest.json
            data/market_analysis_latest.json
          if-no-files-found: warn
          retention-days: 7
