name: Research lab checks

on:
  push:
    branches: [multi-strategy-research-v1, phase2-multi-market-data]
    paths:
      - "strategy_lab.py"
      - "strategy_engine.py"
      - "paper_portfolio_worker.py"
      - "futures_contract_math.py"
      - "futures_paper_ledger.py"
      - "futures_signal_adapter.py"
      - "futures_portfolio_coordinator.py"
      - "tests/**"
      - ".github/workflows/research-lab.yml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "strategy_lab.py"
      - "strategy_engine.py"
      - "futures_contract_math.py"
      - "futures_paper_ledger.py"
      - "futures_signal_adapter.py"
      - "tests/**"
      - ".github/workflows/research-lab.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  research-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m py_compile app.py strategy_lab.py strategy_engine.py paper_portfolio_worker.py futures_contract_math.py futures_paper_ledger.py futures_signal_adapter.py futures_portfolio_coordinator.py
      - run: python -m pytest -q
