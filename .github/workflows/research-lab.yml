name: Research lab checks

on:
  push:
    branches: [multi-strategy-research-v1]
    paths:
      - "strategy_lab.py"
      - "strategy_engine.py"
      - "tests/**"
      - ".github/workflows/research-lab.yml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "strategy_lab.py"
      - "strategy_engine.py"
      - "tests/**"
      - ".github/workflows/research-lab.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  research-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m pytest -q
