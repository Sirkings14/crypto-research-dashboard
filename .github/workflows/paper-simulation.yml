name: BTCUSDT paper simulation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "paper_worker.py"
      - "market_data.py"
      - ".github/workflows/paper-simulation.yml"

permissions:
  contents: write

concurrency:
  group: btcusdt-paper-simulation
  cancel-in-progress: false

jobs:
  advance-paper-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check pandas requests
      - name: Process newly closed candles
        run: python paper_worker.py
      - name: Save durable paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_state.json data/paper_history.csv
          if git diff --cached --quiet; then
            echo "Paper ledger has no new completed bars."
          else
            git commit -m "Update BTCUSDT paper ledger"
            git push
          fi
