name: Multi-market data checks

on:
  push:
    branches: [phase2-multi-market-data]
    paths:
      - "market_universe.py"
      - "market_universe_worker.py"
      - "tests/test_market_universe.py"
      - ".github/workflows/market-data-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "market_universe.py"
      - "market_universe_worker.py"
      - "tests/test_market_universe.py"
      - ".github/workflows/market-data-checks.yml"

permissions:
  contents: read

jobs:
  validate-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pytest
      - name: Compile new modules
        run: python -m py_compile market_universe.py market_universe_worker.py
      - name: Run market data tests
        run: python -m pytest -q tests/test_market_universe.py
