name: 30-day multi-strategy paper run

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "paper_portfolio_worker.py"
      - "strategy_engine.py"
      - "market_data.py"
      - ".github/workflows/forward-paper.yml"

permissions:
  contents: write

concurrency:
  group: 30-day-strategy-paper-run
  cancel-in-progress: false

jobs:
  advance-paper-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Advance the 30-day paper experiment
        run: python paper_portfolio_worker.py
      - name: Save paper state and daily scorecard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strategy_paper_state.json data/strategy_paper_daily.csv
          if git diff --cached --quiet; then
            echo "No new paper state to save."
          else
            git commit -m "Update 30-day strategy paper run"
            git push
          fi
